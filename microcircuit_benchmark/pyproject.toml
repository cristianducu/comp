[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="microcircuit-benchmark"
version="0.1.0"
requires-python=">=3.10"
dependencies=["torch>=2.1","numpy>=1.24","pandas>=2.0","matplotlib>=3.7","tabulate>=0.9"]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
microbench="microbench.run:main"
[tool.pytest.ini_options]
testpaths=["tests"]
